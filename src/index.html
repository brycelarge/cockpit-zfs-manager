<!DOCTYPE html>
<html id="zfs-manager-page" class="pf-theme-dark">
<head>
    <meta charset="utf-8">
    <title translate="yes">ZFS Manager</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="zfs-manager.css">
    <link href="../../static/branding.css" rel="stylesheet" />
</head>
<body class="pf-v6-m-tabular-nums">
    <div id="alerts-requirements" class="pf-v6-c-empty-state hidden"></div>
    <div id="container" class="pf-v6-l-bullseye hidden">
        <div class="pf-v6-l-bullseye__item">
            <div class="pf-v6-c-page">
                <main class="pf-v6-c-page__main">
                    <section class="pf-v6-c-page__main-section">
                        <div class="pf-v6-c-page__main-body">
                            <ul id="alerts-notifications" class="pf-v6-c-alert-group pf-v6-m-toast"></ul>
                            
                            <div class="pf-v6-c-toolbar">
                                <div class="pf-v6-c-toolbar__content">
                                    <div class="pf-v6-c-toolbar__content-section">
                                        <h1 class="pf-v6-c-title pf-v6-m-2xl">Storage Pools</h1>
                                    </div>
                                    <div class="pf-v6-c-toolbar__content-section pf-v6-m-button-group">
                                        <button id="btn-storagepools-create" class="pf-v6-c-button pf-v6-m-primary" type="button">
                                            <i class="fa fa-plus" aria-hidden="true"></i> Create Storage Pool
                                        </button>
                                        <button id="btn-storagepools-import" class="pf-v6-c-button pf-v6-m-secondary" type="button">
                                            <i class="fa fa-download" aria-hidden="true"></i> Import Storage Pool
                                        </button>
                                        <button id="btn-storagepools-refresh" class="pf-v6-c-button pf-v6-m-secondary" type="button">
                                            <i class="fa fa-refresh" aria-hidden="true"></i> Refresh
                                        </button>
                                        <div class="pf-v6-c-menu">
                                            <button class="pf-v6-c-menu-toggle pf-v6-m-secondary" type="button" aria-label="Actions">
                                                <i class="fa fa-caret-down" aria-hidden="true"></i>
                                            </button>
                                            <ul class="pf-v6-c-menu__list" hidden>
                                                <li>
                                                    <button class="pf-v6-c-menu__list-item" id="btn-filesystems-unlock">
                                                        <i class="fa fa-unlock" aria-hidden="true"></i> Unlock File Systems
                                                    </button>
                                                </li>
                                                <li class="pf-v6-c-divider" role="separator"></li>
                                                <li>
                                                    <button class="pf-v6-c-menu__list-item" id="btn-configure">
                                                        <i class="fa fa-cog" aria-hidden="true"></i> Configure
                                                    </button>
                                                </li>
                                                <li>
                                                    <button class="pf-v6-c-menu__list-item" id="btn-about">
                                                        <i class="fa fa-info-circle" aria-hidden="true"></i> About
                                                    </button>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="pf-v6-c-table">
                                <table id="table-storagepools" class="pf-v6-c-table__table" role="table">
                                    <thead>
                                        <tr class="pf-v6-c-table__tr">
                                            <th class="pf-v6-c-table__th listing-ct-toggle"></th>
                                            <th class="pf-v6-c-table__th" colspan="2">Name</th>
                                            <th class="pf-v6-c-table__th">Health</th>
                                            <th class="pf-v6-c-table__th">Size</th>
                                            <th class="pf-v6-c-table__th">Allocated</th>
                                            <th class="pf-v6-c-table__th">Free</th>
                                            <th class="pf-v6-c-table__th">Fragmentation</th>
                                            <th class="pf-v6-c-table__th">Usage</th>
                                            <th class="pf-v6-c-table__th"></th>
                                            <th class="pf-v6-c-table__th"></th>
                                        </tr>
                                        <tr id="spinner-storagepools" class="pf-v6-c-table__tr" style="display: none;">
                                            <td colspan="11" class="pf-v6-c-table__td pf-v6-m-center">
                                                <div class="pf-v6-c-spinner pf-v6-m-xl" role="progressbar" aria-valuetext="Loading...">
                                                    <span class="pf-v6-c-spinner__clipper"></span>
                                                    <span class="pf-v6-c-spinner__lead-ball"></span>
                                                    <span class="pf-v6-c-spinner__tail-ball"></span>
                                                </div>
                                            </td>
                                        </tr>
                                    </thead>
                                    <tbody class="pf-v6-c-table__tbody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="../base1/cockpit.js"></script>
    <script type="text/javascript" src="zfs-manager.js"></script>
</body>
</html>
