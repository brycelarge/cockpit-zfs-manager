<!DOCTYPE html>
<html>
<head>
    <title>ZFS Manager</title>
    <meta charset="utf-8">
    <link href="https://cdn.jsdelivr.net/npm/patternfly@3.59.5/dist/css/patternfly.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/patternfly@3.59.5/dist/css/patternfly-additions.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="zfs-manager.css" type="text/css" rel="stylesheet">
</head>
<body>
    <div id="alerts-requirements" class="blank-slate-pf hidden"></div>
    <div id="container" class="container-fluid hidden">
        <div class="toolbar-pf">
            <div class="toolbar-pf-actions">
                <div class="form-group">
                    <h1>Storage Pools</h1>
                </div>
                <div class="form-group">
                    <button id="btn-storagepools-create" class="btn btn-primary" type="button">
                        <span class="fa fa-plus"></span> Create Storage Pool
                    </button>
                    <button id="btn-storagepools-import" class="btn btn-default" type="button">
                        <span class="fa fa-download"></span> Import Storage Pool
                    </button>
                    <button id="btn-storagepools-refresh" class="btn btn-default" type="button">
                        <span class="fa fa-refresh"></span> Refresh
                    </button>
                    <div class="btn-group">
                        <button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown">
                            <span class="caret"></span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-right">
                            <li><a id="btn-filesystems-unlock"><span class="fa fa-unlock"></span> Unlock File Systems</a></li>
                            <li class="divider"></li>
                            <li><a id="btn-configure"><span class="fa fa-cog"></span> Configure</a></li>
                            <li><a id="btn-about"><span class="fa fa-info-circle"></span> About</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="alerts-notifications"></div>
        
        <div class="list-pf">
            <div class="list-pf-item">
                <table id="table-storagepools" class="table table-striped table-bordered table-hover">
                    <thead>
                        <tr>
                            <th class="listing-ct-toggle"></th>
                            <th colspan="2">Name</th>
                            <th>Health</th>
                            <th>Size</th>
                            <th>Allocated</th>
                            <th>Free</th>
                            <th>Fragmentation</th>
                            <th>Usage</th>
                            <th></th>
                            <th></th>
                        </tr>
                        <tr id="spinner-storagepools" style="display: none;">
                            <td colspan="11" class="text-center">
                                <span class="spinner spinner-lg"></span>
                            </td>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../base1/cockpit.js"></script>
    <script src="zfs-manager.js"></script>
</body>
</html>
